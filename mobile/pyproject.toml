[tool.briefcase]
project_name = "Budget Manager"
bundle = "org.elwazir"
version = "2.2.2"
url = "https://github.com/anubisland/Monthly-Budget-Manager"
license = { file = "LICENSE" }
author = "melwazeer"
author_email = "melwazeer@elwazir.org"

[tool.briefcase.app.budget_manager_mobile]
formal_name = "Budget Manager"
description = "Monthly budget manager with month history, comparison and goals"
# Generated by mobile/tools/make_icon.py. Briefcase appends the size and
# variant it needs (-48, -round-96, ...), so the value names the stem only.
icon = "src/budget_manager_mobile/resources/budget_manager_mobile"
# The second source is the one real ``monthly_budget`` package at the repository
# root. It used to be vendored inside this app as a copy that had already
# diverged (the copy had ``total_budget``, the original ``budget_limits``), so
# every fix had to be made twice. ``sources`` copies files into the bundle, which
# is what a Briefcase build needs: ``requires`` on Android ends up in a
# requirements.txt that Gradle installs from, and a local source directory is not
# something that installer can build.
sources = ["src/budget_manager_mobile", "../monthly_budget"]
requires = [
	"toga-core==0.4.7",
	"travertino==0.3.0",
	"XlsxWriter==3.2.0",
]

# macOS (not used for Android build)
[tool.briefcase.app.budget_manager_mobile.macOS]
requires = []

# iOS
[tool.briefcase.app.budget_manager_mobile.iOS]
requires = [
	"toga-iOS==0.4.7",
	"travertino==0.3.0",
	"XlsxWriter==3.2.0",
]

# Linux
[tool.briefcase.app.budget_manager_mobile.linux]
requires = []

# Windows
[tool.briefcase.app.budget_manager_mobile.windows]
requires = []

# Android
[tool.briefcase.app.budget_manager_mobile.android]
requires = [
	"toga-android==0.4.7",
	"travertino==0.3.0",
	"XlsxWriter==3.2.0",
]
gradle_dependencies = [
	"com.google.android.material:material:1.11.0"
]
