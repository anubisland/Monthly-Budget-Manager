<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Budget Manager</title>
<style>
:root {
  --bg: #f0f2f5; --card: #fff; --tx: #1a1a2e; --ts: #6b7280;
  --pri: #1a73e8; --inc: #00bfa6; --exp: #ea4335; --warn: #ff6b35;
  --nav: #fff; --nav-border: #e5e7eb; --shadow: 0 2px 12px rgba(0,0,0,.08);
  --radius: 14px; --radius-sm: 10px;
  --safe-bg: linear-gradient(135deg,#667eea,#764ba2);
}
.dark {
  --bg: #0f0f1a; --card: #1a1a30; --tx: #e4e4f0; --ts: #9ca3af;
  --nav: #181830; --nav-border: #2a2a45; --shadow: 0 2px 12px rgba(0,0,0,.3);
  --safe-bg: linear-gradient(135deg,#1a1a3e,#2d1b69);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);user-select:none;-webkit-user-select:none;overflow:hidden;height:100vh}
#app{height:100vh;display:flex;flex-direction:column;max-width:480px;margin:auto;position:relative;background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;background:var(--bg);z-index:10}
header h1{font-size:20px;font-weight:700;color:var(--pri)}
header .hdr-btn{background:none;border:none;font-size:20px;padding:6px;cursor:pointer;color:var(--ts);border-radius:50%}
header .hdr-btn:active{background:var(--card)}

/* Month bar: always visible, above every tab. Uses the same card surface,
   radius and shadow as the rest of the app so it reads as part of it. */
#month-bar{display:flex;align-items:center;gap:4px;margin:4px 16px 0;padding:4px;
  background:var(--card);border-radius:var(--radius-sm);box-shadow:var(--shadow)}
#month-bar .mb-arrow{flex:0 0 40px;height:34px;background:none;border:none;
  font-size:22px;line-height:1;color:var(--pri);cursor:pointer;border-radius:var(--radius-sm)}
#month-bar .mb-arrow:active{background:rgba(128,128,128,.12)}
#month-bar .mb-arrow[disabled]{color:var(--ts);opacity:.35;cursor:default}
#month-bar .mb-label{flex:1;height:34px;background:none;border:none;cursor:pointer;
  font-size:14px;font-weight:700;color:var(--tx);display:flex;align-items:center;
  justify-content:center;gap:6px;border-radius:var(--radius-sm)}
#month-bar .mb-label:active{background:rgba(128,128,128,.08)}
#month-bar .mb-past{font-size:10px;font-weight:600;color:#fff;background:var(--warn);
  padding:2px 6px;border-radius:8px}
/* The arrows are fixed to physical direction: left is always the previous
   month and right is always the next one, in both languages. Under dir="rtl"
   flexbox would reverse the row and put "previous" on the right, so the bar
   is pinned to ltr; the label sets its own direction back so the month name
   still reads correctly. Time here is a number line, not a sentence, and the
   arrows point along it rather than along the text. */
#month-bar{direction:ltr}
#month-bar .mb-label{direction:inherit}
/* Load notices. Shown once, dismissible, and never for the ordinary case —
   a banner the user sees every launch is a banner they stop reading. */
#notice{display:none;margin:8px 16px 0;padding:10px 12px;border-radius:var(--radius-sm);
  font-size:12px;line-height:1.5;background:var(--warn);color:#fff;
  display:none;align-items:flex-start;gap:8px}
#notice.show{display:flex}
#notice .nt-text{flex:1}
#notice .nt-close{background:none;border:none;color:#fff;font-size:16px;cursor:pointer;padding:0 2px}
/* Month comparison */
.cmp-empty{font-size:12px;color:var(--ts);text-align:center;padding:8px 0}
.cmp-sub{font-size:11px;color:var(--ts);margin-bottom:10px}
.cmp-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(128,128,128,.12)}
.cmp-row:last-child{border-bottom:none}
.cmp-label{flex:1;font-size:13px;font-weight:600}
.cmp-now{font-size:13px;font-weight:700}
.cmp-was{font-size:11px;color:var(--ts);min-width:64px;text-align:end}
.cmp-delta{font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;min-width:56px;text-align:center}
.cmp-up{background:rgba(234,67,53,.14);color:var(--exp)}
.cmp-down{background:rgba(0,191,166,.16);color:var(--inc)}
.cmp-flat{background:rgba(128,128,128,.14);color:var(--ts)}
.cmp-bars{display:flex;flex-direction:column;gap:3px;margin-top:3px}
.cmp-bar-wrap{height:6px;background:rgba(128,128,128,.12);border-radius:3px;overflow:hidden}
.cmp-bar{height:100%;border-radius:3px}
/* Goal funding */
.goal-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px}
.goal-badge.done{background:var(--inc);color:#fff}
.goal-badge.carried{background:rgba(128,128,128,.18);color:var(--ts)}
.goal-fund{background:var(--pri);color:#fff;border:none;border-radius:var(--radius-sm);
  padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer}
.goal-fund:active{opacity:.8}
.goal-fund[disabled]{background:rgba(128,128,128,.25);color:var(--ts);cursor:default}
.goal-foot{display:flex;align-items:center;gap:8px;margin-top:2px}
.goal-foot .spacer{flex:1}
/* Amount buttons for funding a goal. Their own class: .chip is the category
   selector from the add screen, which carries color:#fff and expects the
   caller to inject a background per category — borrowing it here produced
   white text on white. */
.fund-amounts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fund-amt{background:var(--pri);color:#fff;border:none;border-radius:16px;
  padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer}
.fund-amt:active{transform:scale(.96)}
.fund-amt.all{background:var(--inc)}
/* Pending recurring items. A prompt, never an automatic write: the engine has
   no memory, so applying on sight would double the rent on the next open. */
.rec-card{border-inline-start:3px solid var(--warn)}
.rec-item{display:flex;align-items:center;gap:8px;padding:8px 0;
  border-bottom:1px solid rgba(128,128,128,.12)}
.rec-item:last-child{border-bottom:none}
.rec-body{flex:1;min-width:0}
.rec-name{font-size:13px;font-weight:600}
.rec-meta{font-size:11px;color:var(--ts)}
.rec-add{background:var(--pri);color:#fff;border:none;border-radius:var(--radius-sm);
  padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
.rec-skip{background:none;border:none;color:var(--ts);font-size:12px;cursor:pointer;padding:6px 4px}
/* Rules and templates in settings */
.mini-row{display:flex;align-items:center;gap:8px;padding:7px 0;
  border-bottom:1px solid rgba(128,128,128,.12);font-size:12px}
.mini-row:last-child{border-bottom:none}
.mini-row .grow{flex:1;min-width:0}
.mini-del{background:none;border:none;color:var(--ts);font-size:14px;cursor:pointer;padding:2px 6px}
.mini-empty{font-size:12px;color:var(--ts);padding:6px 0}
/* One line under a heading, saying what the feature is for rather than what
   it is called. Both of these were shipped with names only, and the names
   describe the mechanism, not the benefit. */
.hint{font-size:11px;color:var(--ts);line-height:1.5;margin:2px 0 8px}
/* Forms that read as sentences. Two bare boxes side by side gave no clue
   which was the condition and which the result — the question "what do I
   write here?" was the form's fault, not the user's. */
.rule-form{margin-top:8px;display:flex;flex-direction:column;gap:2px}
.rule-form .form-input{padding:9px 10px;font-size:13px;width:100%}
.rule-form .pair{display:flex;gap:8px}
.rule-form .pair > div{flex:1;min-width:0}
.mini-label{font-size:11px;font-weight:600;color:var(--ts);margin-top:6px;display:block}
/* The restore comparison. Shown before anything is replaced, because a
   confirmation dialog asks whether you are sure without telling you what
   you would lose. */
.rst-row{display:flex;gap:8px;padding:6px 0;font-size:11px;
  border-bottom:1px solid rgba(128,128,128,.12)}
.rst-row:last-child{border-bottom:none}
.rst-m{flex:0 0 62px;font-weight:600}
.rst-side{flex:1;min-width:0}
.rst-gone{color:var(--exp);font-weight:600}
.rst-new{color:var(--inc);font-weight:600}
/* Six-month trend */
.tr-wrap{display:flex;align-items:flex-end;gap:6px;height:110px;margin:10px 0 4px}
.tr-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;justify-content:flex-end}
.tr-bars{display:flex;align-items:flex-end;gap:2px;width:100%;height:100%;justify-content:center}
.tr-bar{width:8px;border-radius:2px 2px 0 0;min-height:2px}
.tr-in{background:var(--inc)}
.tr-ex{background:var(--exp)}
.tr-lbl{font-size:9px;color:var(--ts);white-space:nowrap}
.tr-gap{font-size:9px;color:var(--ts);opacity:.5}
.tr-legend{display:flex;gap:12px;font-size:11px;color:var(--ts);justify-content:center;margin-top:2px}
.tr-key{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:4px}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 8px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.page{display:none;flex-direction:column;gap:12px;animation:fadeIn .25s ease}
.page.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card-title{font-size:13px;font-weight:600;color:var(--ts);margin-bottom:8px}
.big-num{font-size:36px;font-weight:800;letter-spacing:-1px}
.big-num.green{color:var(--inc)}.big-num.red{color:var(--exp)}.big-num.blue{color:var(--pri)}

/* Safe-to-spend */
.safe-card{background:var(--safe-bg);color:#fff;text-align:center;padding:20px;border-radius:var(--radius)}
.safe-card .label{font-size:11px;opacity:.8;margin-bottom:2px}
.safe-card .amount{font-size:42px;font-weight:800;letter-spacing:-1.5px}
.safe-card .sub{font-size:13px;opacity:.7;margin-top:4px}
.safe-ring{width:80px;height:80px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:32px;position:relative}
.safe-ring::before{content:'';position:absolute;inset:-4px;border-radius:50%;border:3px solid rgba(255,255,255,.3)}

/* Stats row */
.stats-row{display:flex;gap:8px}
.stat-card{flex:1;background:var(--card);border-radius:var(--radius-sm);padding:10px;text-align:center;box-shadow:var(--shadow)}
.stat-card .num{font-size:18px;font-weight:700}
.stat-card .lbl{font-size:10px;color:var(--ts);margin-top:2px}

/* Quick add buttons */
.qr{display:flex;gap:8px}
.qr button{flex:1;padding:14px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;transition:transform .1s}
.qr button:active{transform:scale(.96)}
.qr .inc-btn{background:var(--inc);color:#fff}
.qr .exp-btn{background:var(--exp);color:#fff}

/* Category chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:4px;padding:6px 12px;border:none;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;color:#fff;transition:transform .1s}
.chip:active{transform:scale(.95)}
.chip.selected{outline:2.5px solid rgba(0,0,0,.45);outline-offset:1px;transform:scale(1.06);box-shadow:0 2px 8px rgba(0,0,0,.2)}

/* Budget bars */
.budget-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(128,128,128,.12)}
.budget-item:last-child{border-bottom:none}
.budget-cat{font-size:12px;width:72px;flex-shrink:0;color:var(--tx)}
.budget-bar-wrap{flex:1;height:10px;background:rgba(128,128,128,.15);border-radius:5px;overflow:hidden}
.budget-bar{height:100%;border-radius:5px;transition:width .4s ease}
.budget-amt{font-size:12px;width:60px;text-align:right;flex-shrink:0;font-weight:500;color:var(--ts)}
.budget-amt.over{color:var(--exp)}

/* Recent */
.recent-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(128,128,128,.08)}
.recent-item:last-child{border-bottom:none}
.recent-dot{width:4px;height:32px;border-radius:2px;flex-shrink:0}
.recent-name{flex:1;font-size:13px;font-weight:500}
.recent-amt{font-size:13px;font-weight:700}
.recent-amt.inc{color:var(--inc)}
.recent-amt.exp{color:var(--exp)}
.recent-date{font-size:10px;color:var(--ts);margin-left:8px}
.edit-btn{font-size:15px;cursor:pointer;opacity:.25;padding:2px;transition:opacity .15s;user-select:none;flex-shrink:0}
.edit-btn:hover{opacity:1}

/* Add screen */
.add-tabs{display:flex;gap:0;margin-bottom:12px;background:var(--card);border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow)}
.add-tab{flex:1;padding:12px;text-align:center;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;background:transparent;color:var(--ts)}
.add-tab.active{background:var(--inc);color:#fff}
.add-tab.active.exp{background:var(--exp)}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;color:var(--ts);margin-bottom:4px}
.form-input{width:100%;padding:12px 14px;border:1.5px solid rgba(128,128,128,.2);border-radius:var(--radius-sm);font-size:15px;background:var(--bg);color:var(--tx);outline:none;transition:border .15s}
.form-input:focus{border-color:var(--pri)}
.form-input.amount{font-size:24px;font-weight:700;text-align:center;padding:16px}
.date-bar{display:flex;gap:6px;margin-bottom:8px}
.date-btn{padding:6px 14px;border:none;border-radius:16px;font-size:11px;font-weight:500;cursor:pointer;background:rgba(128,128,128,.12);color:var(--ts);transition:all .15s}
.date-btn.active{color:#fff}
.date-btn.active.today{background:var(--pri)}
.date-btn.active.yest{background:var(--pri)}
.date-btn.active.custom{background:var(--warn)}
.date-picker{width:100%;padding:10px;border:1.5px solid rgba(128,128,128,.2);border-radius:var(--radius-sm);font-size:14px;background:var(--bg);color:var(--tx);outline:none;display:none}
.date-picker.show{display:block}
.add-btn{width:100%;padding:16px;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:700;cursor:pointer;transition:transform .1s;color:#fff}
.add-btn:active{transform:scale(.97)}
.add-btn.inc{background:var(--inc)}
.add-btn.exp{background:var(--exp)}

/* Goals */
.goal-card{display:flex;flex-direction:column;gap:6px;padding:12px}
.goal-header{display:flex;align-items:center;gap:8px}
.goal-name{font-size:14px;font-weight:600;flex:1}
.goal-del{background:none;border:none;font-size:16px;cursor:pointer;color:var(--ts);padding:4px}
.goal-progress{display:flex;align-items:center;gap:8px}
.goal-bar-wrap{flex:1;height:8px;background:rgba(128,128,128,.15);border-radius:4px;overflow:hidden}
.goal-bar{height:100%;border-radius:4px;transition:width .4s ease}
.goal-text{font-size:11px;color:var(--ts)}

/* Settings */
.setting-group{margin-bottom:16px}
.setting-group h3{font-size:12px;font-weight:600;color:var(--ts);margin-bottom:8px}
.setting-row{display:flex;gap:8px;margin-bottom:6px}
.setting-btn{flex:1;padding:12px;border:1.5px solid rgba(128,128,128,.2);border-radius:var(--radius-sm);text-align:center;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;background:transparent;color:var(--tx)}
.setting-btn:active{transform:scale(.96)}
.setting-btn.active{background:var(--pri);color:#fff;border-color:var(--pri)}
.setting-btn.danger.active{background:var(--exp);border-color:var(--exp)}

/* Bottom nav */
nav{display:flex;background:var(--nav);border-top:1px solid var(--nav-border);padding:4px 0 env(safe-area-inset-bottom,4px);flex-shrink:0}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:none;background:transparent;cursor:pointer;font-size:10px;color:var(--ts);transition:color .15s}
.nav-btn .icon{font-size:20px;line-height:1}
.nav-btn.active{color:var(--pri)}
.nav-btn:active{opacity:.7}

/* Toast */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 24px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s ease;pointer-events:none;max-width:90%}
#toast.show{opacity:1}

/* Donut canvas */
#donut-wrap{display:flex;justify-content:center;margin:4px 0}
#donut{max-width:160px;max-height:160px}

/* RTL */
[dir=rtl] .recent-date{margin-left:0;margin-right:8px}
[dir=rtl] .budget-amt{text-align:left}
[dir=rtl] .nav-btn{direction:rtl}
[dir=rtl] .goal-header{direction:rtl}
[dir=rtl] .recent-item{direction:rtl}
[dir=rtl] .stats-row{direction:rtl}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.3);border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title"></h1>
    <div style="display:flex;gap:4px">
      <button class="hdr-btn" id="hdr-more" style="display:none">←</button>
    </div>
  </header>

  <div id="month-bar">
    <button class="mb-arrow" id="month-prev" onclick="stepMonth(-1)">&#8249;</button>
    <button class="mb-label" id="month-label" onclick="goToThisMonth()"></button>
    <button class="mb-arrow" id="month-next" onclick="stepMonth(1)">&#8250;</button>
  </div>

  <div id="notice">
    <span class="nt-text" id="notice-text"></span>
    <button class="nt-close" onclick="dismissNotice()">&times;</button>
  </div>

  <main id="main">
    <!-- DASHBOARD -->
    <section id="page-home" class="page active">
      <div class="card rec-card" id="rec-pending" style="display:none">
        <div class="card-title" id="ct-recurring"></div>
        <div id="rec-list"></div>
      </div>
      <div class="safe-card" id="safe-card" style="background:var(--pri);color:#fff">
        <div class="label" id="safe-label" style="color:rgba(255,255,255,.7)"></div>
        <div id="budget-overview"></div>
      </div>
      <div class="stats-row">
        <div class="stat-card"><div class="num" style="color:var(--inc)" id="stat-inc">$0</div><div class="lbl">Income</div></div>
        <div class="stat-card"><div class="num" style="color:var(--exp)" id="stat-exp">$0</div><div class="lbl">Expenses</div></div>
        <div class="stat-card"><div class="num" style="color:var(--pri)" id="stat-net">$0</div><div class="lbl">Net</div></div>
      </div>
      <div class="qr">
        <button class="inc-btn" onclick="showPage('add','inc')">+ Income</button>
        <button class="exp-btn" onclick="showPage('add','exp')">+ Expense</button>
      </div>
      <div class="card" id="goal-card" style="display:none">
        <div class="card-title" id="ct-active-goal"></div>
        <div id="goal-content"></div>
      </div>
      <div class="card">
        <div class="card-title" id="ct-budget"></div>
        <div id="budget-bars"></div>
      </div>
      <div class="card">
        <div class="card-title" id="ct-recent"></div>
        <div id="recent-list"></div>
      </div>
    </section>

    <!-- ADD -->
    <section id="page-add" class="page">
      <div class="add-tabs" id="add-tabs">
        <button class="add-tab active" data-tab="inc" onclick="switchAddTab('inc')">💰 Income</button>
        <button class="add-tab exp" data-tab="exp" onclick="switchAddTab('exp')">💳 Expense</button>
      </div>
      <div class="card">
        <div class="form-group" id="name-group">
          <label id="l-name"></label>
          <select class="form-input" id="input-name-inc">
            <option value="Salary/Wage">💰 Salary / Wage</option>
            <option value="Freelance">💻 Freelance</option>
            <option value="Bonus">🎁 Bonus</option>
            <option value="Extra Pay">📈 Extra Pay</option>
            <option value="Gift">🎀 Gift</option>
            <option value="Investment">📊 Investment</option>
            <option value="Side Work">🔧 Side Work</option>
            <option value="Other">📌 Other</option>
          </select>
          <input class="form-input" id="input-name-exp" autocomplete="off" style="display:none">
        </div>
        <div class="form-group">
          <label id="l-amount"></label>
          <input class="form-input amount" id="input-amount" type="number" step="0.01" min="0" placeholder="0.00" inputmode="decimal">
        </div>
        <div class="form-group" id="cat-group">
          <label id="l-category"></label>
          <div class="chips" id="cat-chips"></div>
        </div>
        <div class="form-group">
          <label id="l-date"></label>
          <div class="date-bar" id="date-bar">
            <button class="date-btn active today" onclick="setDate('today')" id="d-today"></button>
            <button class="date-btn yest" onclick="setDate('yesterday')" id="d-yest"></button>
            <button class="date-btn custom" onclick="setDate('custom')" id="d-custom"></button>
          </div>
          <input class="date-picker" id="date-picker" type="date" onchange="onDatePick(this.value)" style="position:absolute;opacity:0;width:1px;height:1px;pointer-events:none">
          <div style="text-align:center;font-size:13px;font-weight:500;color:var(--pri);margin-top:4px" id="date-display"></div>
        </div>
        <button class="add-btn inc" id="add-btn" onclick="handleAdd()"></button>
      </div>
      <div class="card">
        <div class="card-title" id="l-history"></div>
        <div id="add-history"></div>
      </div>
    </section>

    <!-- BUDGET -->

<script>
// ── State ──
let state = {
  total_income: 0, total_expenses: 0, net: 0,
  incomes: [], expenses: [], goals: [], categories: {},
  total_budget: 0, dark: false, lang: 'en', currency: 'USD',
  year: 2026, month: 7, today: '2026-07-17',
  addTab: 'inc', dateMode: 'today', selDate: '', selCat: 'Uncategorized'
};

let CAT_COLORS = {
  Food:"#E53935",Rent:"#1E88E5",Fuel:"#FB8C00",Electricity:"#FDD835",
  Internet:"#43A047",Water:"#00ACC1",Transport:"#F4511E",Healthcare:"#8E24AA",
  Entertainment:"#D81B60",Education:"#3949AB",Clothing:"#6D4C41",Savings:"#00695C",
  Debt:"#6A1B9A",Subscriptions:"#26A69A",Gifts:"#C0CA33",Misc:"#546E7A",
  Uncategorized:"#90A4AE"
};
const INCOME_COLORS = ["#00BFA6","#448AFF","#FFB74D","#E040FB","#FF5252","#69F0AE","#FF6E40","#9E9E9E"];
let CATS = Object.keys(CAT_COLORS);

const CAT_TRANS = {
  ar: { Food:'طعام', Rent:'إيجار', Fuel:'وقود', Electricity:'كهرباء', Internet:'إنترنت', Water:'مياه', Transport:'مواصلات', Healthcare:'رعاية صحية', Entertainment:'ترفيه', Education:'تعليم', Clothing:'ملابس', Savings:'ادخار', Debt:'ديون', Subscriptions:'اشتراكات', Gifts:'هدايا', Misc:'متنوعات', Uncategorized:'بدون تصنيف' }
};
// ── Month names ──
// Kept beside the other translation tables rather than derived from
// toLocaleDateString: the WebView's available locales differ by platform, and a
// month silently rendering in the wrong language is worse than a fixed list.
const MONTH_NAMES = {
  en: ['January','February','March','April','May','June',
       'July','August','September','October','November','December'],
  ar: ['يناير','فبراير','مارس','أبريل','مايو','يونيو',
       'يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],
};

function monthIndex(month) {
  return Math.min(Math.max(month, 1), 12) - 1;
}

function monthName(month) {
  let names = MONTH_NAMES[state.lang] || MONTH_NAMES.en;
  return names[monthIndex(month)];
}

// "2026-08" -> "August 2026". Used for the previous month in the comparison,
// where only the key is known.
function monthKeyLabel(key) {
  if (!key) return '';
  let parts = String(key).split('-');
  return monthName(parseInt(parts[1], 10)) + ' ' + parts[0];
}

function tc(cat) { return (CAT_TRANS[state.lang] && CAT_TRANS[state.lang][cat]) || cat; }
const INC_TRANS = {
  ar: { 'Salary/Wage':'راتب/أجر', 'Freelance':'عمل حر', 'Bonus':'مكافأة', 'Extra Pay':'دفعة إضافية', 'Gift':'هدية', 'Investment':'استثمار', 'Side Work':'عمل جانبي', 'Other':'آخر' }
};
function tin(name) { return (INC_TRANS[state.lang] && INC_TRANS[state.lang][name]) || name; }
function transIncomeOpts() {
  let sel = document.getElementById('input-name-inc');
  if (!sel) return;
  let icons = {'Salary/Wage':'💰','Freelance':'💻','Bonus':'🎁','Extra Pay':'📈','Gift':'🎀','Investment':'📊','Side Work':'🔧','Other':'📌'};
  [...sel.options].forEach(o => { o.text = (icons[o.value]||'') + ' ' + tin(o.value); });
}
const CURRENCIES = { USD:'$', EUR:'€', GBP:'£', JPY:'¥', AED:'د.إ', SAR:'﷼', EGP:'ج.م', IQD:'د.ع', MAD:'د.م.', KWD:'د.ك', QAR:'﷼', OMR:'﷼', BHD:'د.ب' };
function cs() { return CURRENCIES[state.currency] || '$'; }
function fmt(v) { return cs() + Number(v).toLocaleString(); }
function renderCurrencyOptions() {
  let sel = document.getElementById('sel-currency');
  if (!sel) return;
  sel.innerHTML = Object.keys(CURRENCIES).map(c => `<option value="${c}" ${state.currency===c?'selected':''}>${c} (${CURRENCIES[c]})</option>`).join('');
}
async function setCurrency(c) {
  await postAndRefresh('/api/set-currency', {currency: c});
  state.currency = c;
  render();
  renderCurrencyOptions();
  toast(t('saved_toast'));
}

// ── API ──
async function api(path, data) {
  let opts = {method: data ? 'POST' : 'GET'};
  if (data) {
    opts.body = JSON.stringify(data);
    opts.headers = {'Content-Type': 'application/json'};
  }
  let r = await fetch(path, opts);
  let body = await r.json().catch(() => ({}));
  // fetch only rejects on a network failure, so without this every 4xx and
  // 5xx came back as an ordinary result: a rejected request would assign
  // {error: ...} over the app state and change nothing on screen, and a
  // failed *save* would look exactly like a successful one.
  if (!r.ok) {
    let err = new Error(body.error || ('request failed: ' + r.status));
    err.status = r.status;
    throw err;
  }
  return body;
}
async function refresh() {
  let d = await api('/api/data');
  Object.assign(state, d);
  state.selDate = state.today;
  render();
}
// Returns true when the change was accepted and saved. Callers that want a
// success message check the result; the failure message is handled here so no
// call site can forget it.
async function postAndRefresh(path, data) {
  try {
    await api(path, data);
  } catch (err) {
    // 507 means the change was made but could not be written. That is the one
    // the user must not miss, so it gets its own wording.
    toast(err.status === 507 ? t('save_failed') : t('request_failed'));
    await refresh();
    return false;
  }
  await refresh();
  return true;
}

// ── Toast ──
function toast(msg) {
  let t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2000);
}

// ── Navigation ──
function showPage(name, tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  let icons = ['🏠','➕','📊','🎯','⚙️'];
  let idx = ['home','add','budget','goals','settings'].indexOf(name);
  document.querySelectorAll('.nav-btn')[idx]?.classList.add('active');
  
  document.getElementById('title').textContent = 
    ({home:t('title'), add:t('add'), budget:t('budget'), goals:t('goals'), settings:t('settings')})[name];
  
  if (name === 'add') {
    if (tab) switchAddTab(tab);
    else transIncomeOpts();
    if (state.addTab === 'exp') renderCatChips();
  }
  if (name === 'home') renderBudgetOverview();
  if (name === 'settings') {
    let inp = document.getElementById('input-total-budget');
    if (inp) inp.value = state.total_budget || '';
    renderCurrencyOptions();
  }
  if (name === 'budget') { renderDonut(); renderIncomeDonut(); renderIncExpCompare(); }
}

// ── Date ──
function onDatePick(val) {
  state.selDate = val;
  state.dateMode = 'custom';
  document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('d-custom').classList.add('active');
  updateDateDisplay();
}
function updateDateDisplay() {
  let el = document.getElementById('date-display');
  el.style.display = 'block';
  el.textContent = state.selDate || state.today;
}
function setDate(mode) {
  state.dateMode = mode;
  document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
  let id = {today:'d-today', yesterday:'d-yest', custom:'d-custom'}[mode];
  document.getElementById(id).classList.add('active');
  if (mode === 'custom') {
    let picker = document.getElementById('date-picker');
    picker.value = state.selDate || state.today;
    try { picker.showPicker(); } catch(e) { picker.click(); }
  } else {
    let d = new Date();
    if (mode === 'yesterday') d.setDate(d.getDate() - 1);
    state.selDate = d.toISOString().slice(0,10);
    updateDateDisplay();
  }
}

// ── Add tab ──
function resetEdit() {
  let btn = document.getElementById('add-btn');
  if (btn) {
    btn._editIdx = null;
    btn._editType = null;
    btn.onclick = handleAdd;
    btn.textContent = t(state.addTab === 'inc' ? 'add_income_btn' : 'add_expense_btn');
  }
}
function switchAddTab(tab) {
  resetEdit();
  state.addTab = tab;
  document.querySelectorAll('.add-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  document.querySelector('.add-tab[data-tab="inc"]').textContent = t('income_tab');
  document.querySelector('.add-tab[data-tab="exp"]').textContent = t('expense_tab');
  document.getElementById('cat-group').style.display = tab === 'exp' ? 'block' : 'none';
  document.getElementById('input-name-inc').style.display = tab === 'inc' ? 'block' : 'none';
  document.getElementById('input-name-exp').style.display = tab === 'exp' ? 'block' : 'none';
  let btn = document.getElementById('add-btn');
  btn.textContent = tab === 'inc' ? t('add_income_btn') : t('add_expense_btn');
  btn.className = 'add-btn ' + tab;
  if (tab === 'exp') renderCatChips();
  transIncomeOpts();
  renderAddHistory();
}

// ── Category chips ──
function renderCatChips() {
  let c = document.getElementById('cat-chips'); c.innerHTML = '';
  CATS.forEach(cat => {
    let b = document.createElement('button');
    b.className = 'chip' + (cat === state.selCat ? ' selected' : '');
    b.style.background = CAT_COLORS[cat] || '#636E72';
    b.textContent = tc(cat);
    b.onclick = () => { state.selCat = cat; renderCatChips(); };
    c.appendChild(b);
  });
}

// ── Add entry ──
async function handleAdd() {
  let btn = document.getElementById('add-btn');
  if (btn._editIdx != null) resetEdit();
  let name, nameInput;
  if (state.addTab === 'inc') {
    nameInput = document.getElementById('input-name-inc');
    name = nameInput.value || 'Salary/Wage';
  } else {
    nameInput = document.getElementById('input-name-exp');
    name = nameInput.value.trim() || 'Expense';
  }
  let amt = parseFloat(document.getElementById('input-amount').value) || 0;
  if (amt <= 0) { toast(t('enter_amount')); return; }
  let date = state.selDate || state.today;
  let path = state.addTab === 'inc' ? '/api/add-income' : '/api/add-expense';
  let data = {name, amount: amt, date};
  if (state.addTab === 'exp') data.category = state.selCat;
  await postAndRefresh(path, data);
  if (state.addTab === 'exp') nameInput.value = '';
  document.getElementById('input-amount').value = '';
  toast(t('added_toast'));
}

// ── Goals ──
async function addGoal() {
  let name = document.getElementById('g-name').value.trim();
  let target = parseFloat(document.getElementById('g-target').value) || 0;
  if (!name || target <= 0) { toast(t('enter_amount')); return; }
  let icon = document.getElementById('g-icon').value.trim() || '🎯';
  await postAndRefresh('/api/add-goal', {name, target, icon, current: 0, target_month: ''});
  document.getElementById('g-name').value = '';
  document.getElementById('g-target').value = '';
  document.getElementById('g-icon').value = '🎯';
  toast(t('added_toast'));
}
// Which goal's amount picker is open, or null. Kept outside the goal objects
// because renderGoals rebuilds the list from scratch on every render.
let openFundIdx = null;

function toggleFund(idx) {
  openFundIdx = (openFundIdx === idx) ? null : idx;
  renderGoals();
}

// Preset amounts rather than a keyboard: adding to a goal should be one tap.
// The presets are filtered against what the goal still needs, so a chip can
// never offer more than the goal can take.
function fundOptions(goal) {
  let remaining = goal.remaining;
  let presets = [50, 100, 250, 500, 1000, 2500].filter(v => v < remaining);
  // Keep the four closest to the goal's scale rather than always the smallest.
  if (presets.length > 4) presets = presets.slice(-4);
  return presets.concat([remaining]);
}

function fundPicker(goal, idx) {
  if (openFundIdx !== idx || goal.done) return '';
  let chips = fundOptions(goal).map(v => {
    let label = (v === goal.remaining)
      ? t('fund_all') + ' (' + cs() + v.toLocaleString() + ')'
      : cs() + v.toLocaleString();
    let kind = v === goal.remaining ? 'fund-amt all' : 'fund-amt';
    return `<button class="${kind}" onclick="fundGoal(${idx}, ${v})">${label}</button>`;
  }).join('');
  return `<div class="fund-amounts">${chips}</div>`;
}

async function fundGoal(idx, amount) {
  openFundIdx = null;
  if (await postAndRefresh('/api/fund-goal', {index: idx, amount: amount})) {
    toast(t('deposit_added'));
  }
}

async function delGoal(idx) {
  await postAndRefresh('/api/delete-goal', {index: idx});
  toast(t('added_toast'));
}

function t(key) {
  let lang = state.lang || 'en';
  return (TRANS[lang] && TRANS[lang][key]) || (TRANS.en[key] || key);
}

function applyI18n() {
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = state.lang;
  let navs = document.querySelectorAll('.nav-btn');
  if (navs[0]) navs[0].innerHTML = '<span class="icon">🏠</span>' + t('home');
  if (navs[1]) navs[1].innerHTML = '<span class="icon">➕</span>' + t('add');
  if (navs[2]) navs[2].innerHTML = '<span class="icon">📊</span>' + t('budget');
  if (navs[3]) navs[3].innerHTML = '<span class="icon">🎯</span>' + t('goals');
  if (navs[4]) navs[4].innerHTML = '<span class="icon">⚙️</span>' + t('settings');
  document.getElementById('safe-label').textContent = t('budget_label');
  try { document.querySelector('.inc-btn').textContent = t('add_income'); } catch(e) {}
  try { document.querySelector('.exp-btn').textContent = t('add_expense'); } catch(e) {}
  document.getElementById('l-name').textContent = t('description');
  document.getElementById('l-amount').textContent = t('amount');
  let lc = document.getElementById('l-category');
  if (lc) lc.textContent = t('category');
  document.getElementById('l-date').textContent = t('date');
  document.getElementById('d-today').textContent = t('today');
  document.getElementById('d-yest').textContent = t('yesterday');
  document.getElementById('d-custom').textContent = t('custom');
  document.getElementById('l-history').textContent = t('history');
  // Card titles by ID
  let ctMap = {
    'ct-active-goal': 'active_goal', 'ct-budget': 'budget_progress', 'ct-recent': 'recent',
    'ct-inc-vs-exp': 'inc_vs_exp', 'ct-income-sources': 'income_sources',
    'ct-spending': 'spending_by_cat', 'ct-cat-breakdown': 'cat_breakdown',
    'ct-new-goal': 'new_goal',
  };
  for (let [id, key] of Object.entries(ctMap)) {
    let el = document.getElementById(id);
    if (el) el.textContent = t(key);
  }
  // Settings buttons by ID
  let btnMap = {
    'btn-backup': t('backup'), 'btn-restore': t('restore'),
    'btn-export': t('export'), 'btn-reset': t('reset'),
  };
  for (let [id, text] of Object.entries(btnMap)) {
    let el = document.getElementById(id);
    if (el) el.textContent = text;
  }
  // Theme button
  let tb = document.getElementById('theme-btn');
  if (tb) tb.textContent = state.dark ? t('light_mode') : t('dark_mode');
  // Goals labels
  document.querySelectorAll('#page-goals .form-group label').forEach((el, i) => {
    let m = {0: t('name'), 1: t('target'), 2: t('icon')};
    if (m[i]) el.textContent = m[i];
  });
  // Action buttons
  let agBtn = document.querySelector('[onclick="addGoal()"]');
  if (agBtn) agBtn.textContent = t('add_goal_btn');
  // Add tab labels
  let incTab = document.querySelector('.add-tab[data-tab="inc"]');
  let expTab = document.querySelector('.add-tab[data-tab="exp"]');
  if (incTab) incTab.textContent = t('income_tab');
  if (expTab) expTab.textContent = t('expense_tab');
  let addBtn = document.getElementById('add-btn');
  if (addBtn) addBtn.textContent = state.addTab === 'inc' ? t('add_income_btn') : t('add_expense_btn');
  // Re-render category chips in current language
  if (state.addTab === 'exp') renderCatChips();
  transIncomeOpts();
  // Settings section titles by ID
  let stMap = {
    'st-language': 'language', 'st-theme': 'theme', 'st-data': 'data', 'st-currency': 'currency_label',
    'st-budget': 'budget_label', 'st-about': 'about',
  };
  for (let [id, key] of Object.entries(stMap)) {
    let el = document.getElementById(id);
    if (el) el.textContent = t(key);
  }

  // Total Budget label & Save button
  let budgetLbl = document.querySelector('.setting-group h3 + div span');
  if (budgetLbl) budgetLbl.textContent = t('total_budget') + ':';
  let saveBudBtn = document.querySelector('[onclick="saveBudget()"]');
  if (saveBudBtn) saveBudBtn.textContent = t('save_budget');

  let lbl = document.querySelector('.setting-group h3 + div span');
  if (lbl) lbl.textContent = t('total_budget') + ':';
  updateDateDisplay();
}

async function setLang(l) {
  await postAndRefresh('/api/set-language', {lang: l});
  state.lang = l;
  document.getElementById('lang-en').classList.toggle('active', l === 'en');
  document.getElementById('lang-ar').classList.toggle('active', l === 'ar');
  // Re-set title via showPage to ensure correct language
  let ap = document.querySelector('.page.active');
  let pn = ap ? ap.id.replace('page-','') : 'home';
  showPage(pn);
  applyI18n();
  toast(t('lang_changed'));
}
async function toggleTheme() {
  // Must be a POST. api() picks its method from whether a body was passed, so
  // calling it with none sent a GET — which the server answers only for
  // /api/data and /api/backup. The theme button was a silent 404.
  if (!await postAndRefresh('/api/toggle-theme', {})) return;
  applyTheme();
}

function applyTheme() {
  document.documentElement.classList.toggle('dark', !!state.dark);
  let btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = state.dark ? t('light_mode') : t('dark_mode');
}
// Two taps instead of confirm(). An Android WebView answers the blocking
// dialogs false unless the host app implements onJsConfirm, so this function
// returned at its first line and never deleted anything — while looking like a
// button the user had simply thought better of pressing.
let resetArmed = false;

async function resetAll() {
  let btn = document.getElementById('btn-reset');
  if (!resetArmed) {
    resetArmed = true;
    btn.textContent = t('reset_confirm_btn');
    btn.style.background = 'var(--exp)';
    btn.style.color = '#fff';
    clearTimeout(btn._t);
    // Disarms itself, so a stray tap cannot leave the button primed to wipe
    // everything the next time it happens to be touched.
    btn._t = setTimeout(disarmReset, 5000);
    return;
  }
  disarmReset();
  if (await postAndRefresh('/api/reset', {})) toast(t('saved_toast'));
}

function disarmReset() {
  resetArmed = false;
  let btn = document.getElementById('btn-reset');
  if (!btn) return;
  clearTimeout(btn._t);
  btn.textContent = t('reset_all_btn');
  btn.style.background = '';
  btn.style.color = 'var(--exp)';
}
async function backup() {
  // Same path as the spreadsheet export: write the file, then hand it to the
  // share sheet. The old version built a Blob and clicked an <a download>,
  // which needs a DownloadListener the Android WebView does not register —
  // and then reported success by checking that the `download` attribute
  // exists, which it always does. It said "saved" every time, saved nothing,
  // and named no place to look.
  if (!await postAndRefresh('/api/backup-file', {})) return;
  reportFileResult();
}

// Shared by backup and export. A share sheet that opened needs no message;
// a fallback does, and only the file name is any use — the full path lives
// inside app-private storage that no file manager can open.
function reportFileResult() {
  let result = state.last_export;
  if (!result) { toast(t('request_failed')); return; }
  if (result.shared) return;
  // Split on both separators without a regex. Writing one here means
  // escaping a backslash through however many layers of quoting sit
  // between the source and the file, and it has silently lost one
  // before — leaving a Windows path unsplit and the whole path in the
  // toast, which is exactly what this line exists to avoid.
  let parts = String(result.path).split(String.fromCharCode(92)).pop();
  let name = parts.split('/').pop();
  toast(t('export_saved').replace('{path}', name));
}
// Restoring replaces everything, so it is three deliberate steps: paste the
// backup, see what it would change, then apply. A confirmation dialog would
// ask whether you are sure without telling you what you would lose.
function toggleRestore() {
  let panel = document.getElementById('restore-panel');
  panel.style.display = panel.style.display === 'none' ? '' : 'none';
  if (panel.style.display === 'none') clearRestore();
}

function clearRestore() {
  document.getElementById('restore-text').value = '';
  document.getElementById('restore-diff').innerHTML = '';
}

async function previewRestore() {
  let text = document.getElementById('restore-text').value.trim();
  if (!text) { toast(t('restore_paste_first')); return; }
  if (!await postAndRefresh('/api/preview-restore', {text: text})) return;
  renderRestoreDiff();
}

function renderRestoreDiff() {
  let el = document.getElementById('restore-diff');
  let d = state.restore_preview;
  if (!d) { el.innerHTML = ''; return; }

  let rows = d.months.map(m => {
    // Red for what disappears, green for what arrives.
    // Both totals, not just expenses: a month of pure income showed as
    // "0" and read as empty, which is the opposite of what it is — and
    // this table exists to prevent a decision made on a wrong impression.
    let side = s => s ? '+' + cs() + s.income.toLocaleString() +
                        ' / -' + cs() + s.expenses.toLocaleString() : '—';
    let mine = side(m.mine);
    let theirs = side(m.theirs);
    let lost = m.mine && !m.theirs;
    let gained = !m.mine && m.theirs;
    return `<div class="rst-row">
        <span class="rst-m">${monthKeyLabel(m.month)}</span>
        <span class="rst-side ${lost ? 'rst-gone' : ''}">${t('rst_now')}: ${mine}</span>
        <span class="rst-side ${gained ? 'rst-new' : ''}">${t('rst_after')}: ${theirs}</span>
      </div>`;
  }).join('');

  let losing = d.months.filter(m => m.mine && !m.theirs).length;
  el.innerHTML = `
    <div class="cmp-sub" style="margin-top:8px">${t('rst_heading')}</div>
    ${rows}
    <div class="hint" style="margin-top:8px">${t('rst_goals')
      .replace('{a}', d.goals_now).replace('{b}', d.goals_after)}</div>
    ${losing ? `<div class="hint rst-gone">${t('rst_losing').replace('{n}', losing)}</div>` : ''}
    <button class="setting-btn danger" style="color:var(--exp)"
      onclick="applyRestore()">${t('rst_apply')}</button>`;
}

async function applyRestore() {
  if (!await postAndRefresh('/api/restore', {})) return;
  clearRestore();
  document.getElementById('restore-panel').style.display = 'none';
  toast(t('rst_done'));
}
async function exportXLSX() {
  if (!await postAndRefresh('/api/export', {month: state.month_key})) return;
  reportFileResult();
}

function renderBudgetOverview() {
  let el = document.getElementById('budget-overview');
  if (!el) return;
  let budget = state.total_budget || 0;
  let spent = state.total_expenses || 0;
  if (budget <= 0) {
    el.innerHTML = '<div style="text-align:center;padding:8px 0"><div class="amount" style="font-size:28px;color:#fff">' + cs() + spent.toLocaleString() + '</div><div class="sub" style="margin-top:2px;color:rgba(255,255,255,.7)">' + t('expenses') + '</div><div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:6px">' + t('set_in_settings') + '</div></div>';
    return;
  }
  let pct = Math.min(spent / budget * 100, 100);
  let remaining = budget - spent;
  let remPct = Math.max(0, (remaining / budget) * 100);
  let isOver = spent > budget;
  el.innerHTML = `
    <div class="amount" style="font-size:28px;color:#fff">${cs()}${budget.toLocaleString()}</div>
    <div class="sub" style="margin-top:2px;color:rgba(255,255,255,.7)">${t('total_budget')}</div>

// ── Managing rules and recurring templates ──
// Every field that can be a choice is a choice: categories, frequency and day
// are dropdowns filled from what the app already knows, so the only typing is
// a name and an amount.

const FREQUENCIES = ['monthly', 'weekly', 'biweekly', 'quarterly', 'yearly'];

function fillSelect(id, values, labeller) {
  let el = document.getElementById(id);
  if (!el) return;
  let previous = el.value;
  el.innerHTML = values.map(v =>
    `<option value="${v}">${labeller ? labeller(v) : v}</option>`).join('');
  if (values.indexOf(previous) >= 0) el.value = previous;
}

function renderAutomationSettings() {
  disarmReset();
  document.getElementById('st-rules').textContent = t('rules_title');
  document.getElementById('hint-rules').textContent = t('rules_hint');
  document.getElementById('hint-recurring').textContent = t('recurring_hint');

  // carry the number as text, so it never moved.

// ── Six-month trend ──
// Two months answer "was this month worse than last?", which one holiday can
// decide. Six answer "am I improving?", which is the question worth asking.

// Written in full, once, below the chart: the axis has numbers so the reader
// still needs to be told which months they are.
function spanLabel(points) {
  if (!points.length) return '';
  let first = points[0].month.split('-');
  let last = points[points.length - 1].month.split('-');
  let start = monthName(parseInt(first[1], 10)) + (first[0] !== last[0] ? ' ' + first[0] : '');
  return start + ' – ' + monthName(parseInt(last[1], 10)) + ' ' + last[0];
}

function renderTrend() {
  let el = document.getElementById('trend-body');
  if (!el) return;
  document.getElementById('ct-trend').textContent = t('trend_title');

  let points = state.trend || [];
  let avg = state.trend_avg || {months: 0};
  if (!avg.months) {
    el.innerHTML = `<div class="cmp-empty">${t('trend_empty')}</div>`;
    return;
  }

  // One scale for both series and every month, so the bars are comparable
  // across the whole chart. Scaling each column to itself would make every
  // month look identical.
  let max = Math.max(1, ...points.map(p => Math.max(p.income, p.expenses)));
  let columns = points.map(p => {
    // The axis label is the month number, not its name. A number needs no
    // translation, cannot be truncated into a broken word, and carries no
    // joined-script shaping to get wrong — which is exactly the failure that
    // slicing a name to three characters produced in Arabic. The full names
    // appear once in the subtitle below, where there is room for them.
    let label = String(parseInt(p.month.split('-')[1], 10));
    if (p.empty) {
      // Drawn as a gap, not as a zero: nothing recorded is not the same claim
      // as nothing spent, and a zero column asserts the second.
      return `<div class="tr-col"><div class="tr-bars"><span class="tr-gap">—</span></div>
              <div class="tr-lbl">${label}</div></div>`;
    }
    let h = v => Math.max(2, v / max * 100);
    return `<div class="tr-col">
        <div class="tr-bars">
          <div class="tr-bar tr-in" style="height:${h(p.income)}%"></div>
          <div class="tr-bar tr-ex" style="height:${h(p.expenses)}%"></div>
        </div>
        <div class="tr-lbl">${label}</div>
      </div>`;
  }).join('');

  el.innerHTML = `
    <div class="tr-wrap">${columns}</div>
    <div class="tr-legend">
      <span><i class="tr-key tr-in"></i>${t('income')}</span>
      <span><i class="tr-key tr-ex"></i>${t('expenses')}</span>
    </div>
    <div class="cmp-sub" style="margin-top:6px;text-align:center">${spanLabel(points)}</div>
    <div class="cmp-sub" style="text-align:center">
      ${t('trend_avg')} · ${t('income')} ${cs()}${avg.income.toLocaleString()}
      · ${t('expenses')} ${cs()}${avg.expenses.toLocaleString()}
      (${avg.months})
    </div>`;
}

// Labels that name the currency belong here, not in applyI18n(). That
// function is called only when the language changes, so a label built from
// both the language and the currency was left showing the old symbol after a
// currency change — "Target ($)" under a budget in ج.م. render() runs after
// every refresh whatever caused it, so no path can forget it.
function renderCurrencyLabels() {
  let target = document.getElementById('l-target');
  if (target) target.textContent = t('target') + ' (' + cs() + ')';
  setPlaceholders();
}

// Example text inside inputs is content like any other, and three of these
// were written straight into the HTML in English — so an Arabic user saw
// "Vacation" and "Rent" prompting them. Set here rather than in the markup so
// they follow the language like everything else.
function setPlaceholders() {
  let hints = {
    'g-name': 'ph_goal',
    'rec-desc': 'ph_recurring',
    'rule-pattern': 'ph_rule',
    'input-name-exp': 'ph_entry',
  };
  for (let id in hints) {
    let el = document.getElementById(id);
    if (el) el.placeholder = t(hints[id]);
  }
}

// ── Spending pace ──
// The marker is the whole idea: a tick on the budget bar at the point the
// month has reached. Fill past the tick means spending faster than the month
// is passing, read at a glance with no arithmetic and no second number.

//: Pace states with nothing to say. A state absent from this list falls
//: through to the on-track wording, so anything new must be listed here or
//: it silently claims the month is fine.
const QUIET_PACE_STATES = ['no_budget', 'not_started'];

function paceMarker() {
  let p = state.pace;
  // Both states mean there is nothing to mark: no budget to measure against,
  // or a month that has not begun. Listing them explicitly rather than
  // falling through keeps a new state from silently inheriting the on-track
  // rendering, which is what happened when 'not_started' was added.
  if (!p || QUIET_PACE_STATES.indexOf(p.state) >= 0 || !p.elapsed) return '';
  // inset-inline-start, not left: under dir="rtl" the bar fills from the
  // right, and a marker pinned to the left would sit at the wrong end of it.
  return `<div title="${t('pace_marker')}" style="position:absolute;top:-3px;bottom:-3px;
    inset-inline-start:${Math.min(p.elapsed, 100)}%;width:2px;background:rgba(0,0,0,.35);
    border-radius:1px"></div>`;
}

function paceLine() {
  let p = state.pace;
  if (!p || QUIET_PACE_STATES.indexOf(p.state) >= 0) return '';

  let text, colour;
  if (p.state === 'over') {
    text = t('pace_over');
    colour = 'rgba(255,200,200,.95)';
  } else if (p.state === 'ahead') {
    // The projection is the actionable part: "spending fast" is a feeling,
    // "landing at 4,100 against 3,000" is a number to act on.
    text = p.projected
      ? t('pace_ahead_to').replace('{n}', cs() + Math.round(p.projected).toLocaleString())
      : t('pace_ahead');
    colour = 'rgba(255,224,178,.95)';
  } else {
    text = t('pace_on_track');
    colour = 'rgba(255,255,255,.75)';
  }
  let days = p.days_left > 0 ? ' · ' + t('days_left').replace('{n}', p.days_left) : '';
  return `<div style="margin-top:6px;font-size:11px;color:${colour}">${text}${days}</div>`;
}

// ── Recurring items ──
// These are offered, never applied on sight. The engine that expands a
// template into expenses is a pure function with no memory, so anything that
// applied automatically would add the rent again on every month open.

function renderPendingRecurring() {
  let card = document.getElementById('rec-pending');
  let list = state.pending_recurring || [];
  // Set before the early return. English text written into the HTML is a
  // debt: it works until some path skips the line that replaces it, and this
  // one skipped it whenever there was nothing pending — leaving an English
  // heading in an Arabic interface the moment the card first appeared.
  document.getElementById('ct-recurring').textContent = t('recurring_due');
  if (!list.length) { card.style.display = 'none'; return; }

  card.style.display = '';
  document.getElementById('rec-list').innerHTML = list.map(item => {
    // A weekly template covers several dates in one month, so the total is
    // what accepting actually costs — not the per-occurrence amount.
    let meta = tc(item.category) + ' · ' + cs() + item.total.toLocaleString()
      + (item.count > 1 ? ' (' + item.count + '×)' : '');
    return `
      <div class="rec-item">
        <div class="rec-body">
          <div class="rec-name">${item.description}</div>
          <div class="rec-meta">${meta}</div>
        </div>
        <button class="rec-skip" onclick="skipRecurring(${item.id})">${t('not_this_month')}</button>
        <button class="rec-add" onclick="applyRecurring(${item.id})">${t('add_it')}</button>
      </div>`;
  }).join('');
}

async function applyRecurring(id) {
  if (await postAndRefresh('/api/apply-recurring', {id: id})) toast(t('added_toast'));
}

async function skipRecurring(id) {
  // Recorded, not ignored: the template stops asking this month and asks
  // again next month.
  await postAndRefresh('/api/skip-recurring', {id: id});
}

// ── Month comparison ──

// A percentage against a tiny base is arithmetically right and useless to read:
// 1 last month against 1000 this month is "+99,900%". Below this floor the
// change is reported as an amount instead.
const CMP_MIN_BASE = 10;

// Must match goals.SAVINGS_CATEGORY on the Python side: it is the category a
// goal deposit is filed under.
const SAVINGS_CATEGORY = 'Savings';

function deltaOf(now, was) {
  let diff = Math.round((now - was) * 100) / 100;
  if (Math.abs(diff) < 0.005) return {diff: 0, kind: 'flat', text: t('no_change')};
  let kind = diff > 0 ? 'up' : 'down';
  let sign = diff > 0 ? '+' : '−';
  let text = (was === 0)
    ? t('cmp_new')
    : (Math.abs(was) < CMP_MIN_BASE
        ? sign + cs() + Math.abs(diff).toLocaleString()
        : sign + Math.abs(diff / was * 100).toFixed(0) + '%');
  return {diff: diff, kind: kind, text: text};
}

// Rising expenses are bad and rising income is good, so the colour follows the
// meaning rather than the sign. Reusing one palette for both would paint a
// raise in the same red as overspending.
function deltaClass(kind, higherIsBetter) {
  if (kind === 'flat') return 'cmp-flat';
  let good = (kind === 'up') === higherIsBetter;
  return good ? 'cmp-down' : 'cmp-up';
}

function cmpRow(label, now, was, higherIsBetter) {
  let d = deltaOf(now, was);
  let max = Math.max(Math.abs(now), Math.abs(was), 1);
  let bar = (v, color) =>
    `<div class="cmp-bar-wrap"><div class="cmp-bar" style="width:${Math.abs(v) / max * 100}%;background:${color}"></div></div>`;
  return `
    <div class="cmp-row">
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="cmp-label">${label}</span>
          <span class="cmp-now">${cs()}${now.toLocaleString()}</span>
          <span class="cmp-delta ${deltaClass(d.kind, higherIsBetter)}">${d.text}</span>
        </div>
        <div class="cmp-bars">
          ${bar(now, 'var(--pri)')}
          ${bar(was, 'rgba(128,128,128,.45)')}
        </div>
        <div class="cmp-was">${t('was')} ${cs()}${was.toLocaleString()}</div>
      </div>
    </div>`;
}

function renderComparison() {
  let el = document.getElementById('compare-body');
  document.getElementById('ct-compare').textContent = t('comparison');

  let prev = state.previous;
  if (!prev) {
    // Deliberately not a table of zeros: a comparison against nothing is not a
    // finding, and showing one would invite the user to read meaning into it.
    el.innerHTML = '<div class="cmp-empty">' + t('no_previous') + '</div>';
    return;
  }

  let html = '<div class="cmp-sub">' + t('vs_previous') + ' · ' + monthKeyLabel(prev.month_key) + '</div>';
  html += cmpRow(t('income'), state.total_income, prev.total_income, true);
  html += cmpRow(t('expenses'), state.total_expenses, prev.total_expenses, false);
  html += cmpRow(t('net'), state.net, prev.net, true);

  // Categories that moved most, so the row explaining the change is on top
  // rather than buried under whichever category happens to be alphabetically
  // first.
  let names = new Set([...Object.keys(state.categories), ...Object.keys(prev.categories)]);
  let cats = [...names].map(name => ({
    name: name,
    now: (state.categories[name] || {}).amount || 0,
    was: prev.categories[name] || 0,
  })).filter(c => c.now || c.was);
  cats.sort((a, b) => Math.abs(b.now - b.was) - Math.abs(a.now - a.was));

  if (cats.length) {
    html += '<div class="cmp-sub" style="margin-top:12px">' + t('by_category') + '</div>';
    // Savings is where goal deposits land, so more of it is an achievement,
    // not an overspend. Colouring it like rent would paint every contribution
    // to a goal in the same red as a blown budget.
    cats.slice(0, 6).forEach(c => {
      html += cmpRow(tc(c.name), c.now, c.was, c.name === SAVINGS_CATEGORY);
    });
  }
  el.innerHTML = html;
}

// ── Load notices ──
// The server reports how the last load went. Anything other than a clean read
// means the user's file was changed, moved or partly discarded, and they are
// the only one who can judge whether that matters.
let noticeDismissed = null;

function renderNotice() {
  let el = document.getElementById('notice');
  let note = state.note;
  if (!note || note === noticeDismissed) { el.classList.remove('show'); return; }
  // Notes use hyphens ("future-version"); translation keys use underscores.
  // t() falls back to the key itself, so a mismatch would print
  // "note_future-version" at the user rather than a sentence.
  let text = t('note_' + note.replace(/-/g, '_'));
  // A migration can also drop rows. Reporting only the migration would leave
  // the user unaware that anything went missing, which is the more important
  // half of the message.
  if (state.dropped > 0) {
    let dropped = t('note_partial').replace('{n}', state.dropped);
    text = note === 'partial' ? dropped : text + ' ' + dropped;
  }
  document.getElementById('notice-text').textContent = text;
  el.classList.add('show');
}

function dismissNotice() {
  noticeDismissed = state.note;
  document.getElementById('notice').classList.remove('show');
}

// ── Month bar ──
function renderMonthBar() {
  document.getElementById('month-label').innerHTML =
    monthName(state.month) + ' ' + state.year +
    (state.is_current_month ? '' : ' <span class="mb-past">' + t('past_month') + '</span>');
  // Disabled rather than hidden: a button that vanishes moves the label and
  // makes the bar jump between months.
  document.getElementById('month-prev').disabled = false;
  document.getElementById('month-next').disabled = !state.can_go_forward;
}

async function stepMonth(delta) {
  if (delta > 0 && !state.can_go_forward) return;
  await postAndRefresh('/api/step-month', {delta: delta});
}

// Tapping the label returns to the present, which is the one month always
// reachable in a single gesture however far back you have gone.
async function goToThisMonth() {
  if (state.is_current_month) return;
  await postAndRefresh('/api/set-month', {month: state.today.slice(0, 7)});
}

function renderBudgetBars() {
  let b = document.getElementById('budget-bars'); b.innerHTML = '';
  let budget = state.total_budget || 0;
  if (budget <= 0) { b.innerHTML = '<div style="font-size:12px;color:var(--ts);padding:4px 0">' + t('set_in_settings') + '</div>'; return; }
  let spent = state.total_expenses || 0;
  let pct = Math.min(spent / budget * 100, 100);
  let isOver = spent > budget;
  let remaining = Math.max(0, budget - spent);
  b.innerHTML = `
    <div class="budget-item">
      <span class="budget-cat" style="font-weight:600">${t('total_budget')}</span>
      <div class="budget-bar-wrap"><div class="budget-bar" style="width:${pct}%;background:${isOver?'var(--exp)':'var(--pri)'}"></div></div>
      <span class="budget-amt ${isOver?'over':''}">${cs()}${spent.toFixed(0)} / ${cs()}${budget.toFixed(0)}</span>
    </div>
    <div style="font-size:11px;color:var(--ts);margin-top:4px;text-align:${state.lang==='ar'?'left':'right'}">${isOver?t('over_by')+' '+cs()+(spent-budget).toFixed(0):t('remaining')+': '+cs()+remaining.toFixed(0)+' ('+(remaining/budget*100).toFixed(0)+'%)'}</div>
  `;
}

function renderRecent() {
  let r = document.getElementById('recent-list'); r.innerHTML = '';
  let all = [
    ...state.incomes.map(i=>({...i,type:'inc',color:CAT_COLORS.Income||'#00BFA6'})),
    ...state.expenses.map(e=>({...e,type:'exp',color:CAT_COLORS[e.category]||'#636E72'}))
  ].sort((a,b) => (b.date||'').localeCompare(a.date||''));
  if (all.length === 0) { r.innerHTML = '<div style="font-size:12px;color:var(--ts);padding:8px 0;text-align:center">' + t('no_entries') + '</div>'; return; }
  all.slice(0,10).forEach((item, i) => {
    let isInc = item.type === 'inc';
    r.innerHTML += `
      <div class="recent-item">
        <div class="recent-dot" style="background:${isInc?'var(--inc)':item.color}"></div>
        <span class="recent-name">${isInc?tin(item.name):tc(item.category||item.name)}</span>
        <span class="recent-amt ${isInc?'inc':'exp'}">${isInc?'+':'-'}${cs()}${item.amount.toFixed(2)}</span>
        <span class="recent-date">${(item.date||'').slice(-5)}</span>
      </div>`;
  });
}

function renderAddHistory() {
  let h = document.getElementById('add-history');
  if (!h) return;
  let filter = state.addTab || 'inc';
  let items = filter === 'inc'
    ? state.incomes.map((i, idx) => ({...i, type:'inc', color:'var(--inc)', _idx: idx}))
    : state.expenses.map((e, idx) => ({...e, type:'exp', color:CAT_COLORS[e.category]||'var(--ts)', _idx: idx}));
  let all = items.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  if (all.length === 0) { h.innerHTML = '<div style="font-size:12px;color:var(--ts);text-align:center;padding:8px">' + t('no_history') + '</div>'; return; }
  h.innerHTML = all.slice(0,8).map((item, i) => `
    <div class="recent-item">
      <div class="recent-dot" style="background:${item.type==='inc'?'var(--inc)':item.color}"></div>
      <span class="recent-name">${item.type==='inc'?tin(item.name):tc(item.category||item.name)}</span>
      <span class="recent-amt ${item.type==='inc'?'inc':'exp'}">${item.type==='inc'?'+':'-'}${cs()}${item.amount.toFixed(2)}</span>
      <span class="recent-date">${(item.date||'').slice(-5)}</span>
      <span class="edit-btn" onclick="editEntry(${item._idx})">✏️</span>
    </div>
  `).join('');
}

function editEntry(idx) {
  let tab = state.addTab || 'inc';
  let item = tab === 'inc' ? state.incomes[idx] : state.expenses[idx];
  if (!item) return;
  if (!document.getElementById('page-add').classList.contains('active')) showPage('add', tab);
  else switchAddTab(tab);
  document.getElementById('input-amount').value = item.amount;
  if (tab === 'inc') {
    document.getElementById('input-name-inc').value = item.name;
  } else {
    document.getElementById('input-name-exp').value = item.name;
    state.selCat = item.category;
    renderCatChips();
  }
  setDate('custom');
  document.getElementById('date-picker').value = item.date || state.today;
  state.selDate = item.date || state.today;
  let btn = document.getElementById('add-btn');
  btn._editIdx = idx;
  btn._editType = tab;
  btn.textContent = '✏️ ' + t(tab === 'inc' ? 'add_income_btn' : 'add_expense_btn');
  btn.onclick = () => updateEntry(idx, tab);
  toast(t('edit_mode'));
}

async function updateEntry(idx, tab) {
  let name = tab === 'inc'
    ? document.getElementById('input-name-inc').value || 'Salary/Wage'
    : document.getElementById('input-name-exp').value.trim() || 'Expense';
  let amt = parseFloat(document.getElementById('input-amount').value) || 0;
  if (amt <= 0) { toast(t('enter_amount')); return; }
  let date = state.selDate || state.today;
  let data = {index: idx, name, amount: amt, date};
  if (tab === 'exp') data.category = state.selCat;
  await postAndRefresh(tab === 'inc' ? '/api/edit-income' : '/api/edit-expense', data);
  let btn = document.getElementById('add-btn');
  btn._editIdx = null;
  btn._editType = null;
  btn.onclick = handleAdd;
  btn.textContent = t(tab === 'inc' ? 'add_income_btn' : 'add_expense_btn');
  toast(t('saved_toast'));
}

function renderBudgetDetail() {
  let d = document.getElementById('budget-detail'); d.innerHTML = '';
  let cats = Object.entries(state.categories).filter(([k,v]) => v.amount > 0);
  if (cats.length === 0) { d.innerHTML = '<div style="font-size:12px;color:var(--ts);text-align:center;padding:12px">' + t('no_cat_data') + '</div>'; return; }
  let total = cats.reduce((s, [k,v]) => s + v.amount, 0);
  cats.sort((a,b) => b[1].amount - a[1].amount).forEach(([cat, data]) => {
    let pct = data.amount / total * 100;
    d.innerHTML += `
      <div class="budget-item">
        <span class="budget-cat">${tc(cat)}</span>
        <div class="budget-bar-wrap"><div class="budget-bar" style="width:${pct}%;background:${data.color||'#636E72'}"></div></div>
        <span class="budget-amt">${cs()}${data.amount.toFixed(0)}</span>
      </div>`;
  });
}

function renderGoals() {
  let g = document.getElementById('goal-list'); g.innerHTML = '';
  if (state.goals.length === 0) {
    g.innerHTML = '<div class="card" style="font-size:12px;color:var(--ts);text-align:center">' + t('no_goals') + '</div>';
    return;
  }
  state.goals.forEach((goal, idx) => {
    // The server computes progress by summing this goal's deposits across every
    // month, so the bar shows accumulated funding rather than a stored number
    // nothing could ever change.
    let pct = goal.pct || 0;
    let badges = '';
    if (goal.done) badges += `<span class="goal-badge done">${t('goal_done')}</span>`;
    else if (goal.carried_over) badges += `<span class="goal-badge carried">${t('carried_over')}</span>`;
    let thisMonth = goal.this_month
      ? `<span class="goal-text">+${cs()}${goal.this_month.toLocaleString()} ${t('added_this_month')}</span>`
      : '';
    g.innerHTML += `
      <div class="card goal-card">
        <div class="goal-header">
          <span style="font-size:20px">${goal.icon}</span>
          <span class="goal-name">${goal.name}</span>
          ${badges}
          <button class="goal-del" onclick="delGoal(${idx})">✕</button>
        </div>
        <div class="goal-progress">
          <div class="goal-bar-wrap"><div class="goal-bar" style="width:${pct}%;background:${goal.done ? 'var(--inc)' : 'var(--pri)'}"></div></div>
        </div>
        <div class="goal-text">${cs()}${goal.current.toLocaleString()} / ${cs()}${goal.target.toLocaleString()} · ${pct.toFixed(0)}%</div>
        <div class="goal-foot">
          ${thisMonth}
          <span class="spacer"></span>
          <span class="goal-text">${t('remaining')} ${cs()}${goal.remaining.toLocaleString()}</span>
          <button class="goal-fund" onclick="toggleFund(${idx})" ${goal.done ? 'disabled' : ''}>${t('fund_goal')}</button>
        </div>
        ${fundPicker(goal, idx)}
      </div>`;
  });
}

// ── Donut chart ──
function renderDonutMini() {
  let cv = document.getElementById('donut');
  if (!cv || document.getElementById('page-budget').classList.contains('active')) return;
  // Skip mini donut on home for now, render on budget page only
}

function renderDonut() {
  let cv = document.getElementById('donut');
  if (!cv) return;
  let ctx = cv.getContext('2d'); let s = 200; let r = 75; let w = 32;
  cv.width = s; cv.height = s;
  ctx.clearRect(0,0,s,s);
  
  let cats = Object.entries(state.categories).filter(([k,v]) => v.amount > 0);
  if (cats.length === 0) {
    ctx.fillStyle = 'var(--ts)'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t('no_data'), s/2, s/2);
    return;
  }
  
  let total = cats.reduce((s, [k,v]) => s + v.amount, 0);
  let start = -Math.PI / 2;
  
  // Draw donut slices with white gap
  cats.forEach(([cat, data]) => {
    let slice = (data.amount / total) * Math.PI * 2;
    let gap = 0.04;
    ctx.beginPath(); ctx.arc(s/2, s/2, r, start + gap, start + slice - gap);
    ctx.arc(s/2, s/2, r - w, start + slice - gap, start + gap, true);
    ctx.closePath();
    ctx.fillStyle = data.color || '#636E72';
    ctx.fill();
    start += slice;
  });
  
  // Center text
  ctx.fillStyle = 'var(--tx)'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(cs() + total.toFixed(0), s/2, s/2 - 6);
  ctx.fillStyle = 'var(--ts)'; ctx.font = '10px sans-serif';
  ctx.fillText(t('spending_by_cat'), s/2, s/2 + 12);
  
  // Legend with percentages
  let leg = document.getElementById('donut-legend');
  leg.innerHTML = cats.sort((a,b) => b[1].amount - a[1].amount).map(([cat, data]) => `
    <div style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px">
      <span style="width:12px;height:12px;border-radius:3px;background:${data.color};flex-shrink:0"></span>
      <span style="flex:1">${tc(cat)}</span>
      <span style="font-weight:600">${cs()}${data.amount.toFixed(0)}</span>
      <span style="color:var(--ts);min-width:36px;text-align:right">${(data.amount/total*100).toFixed(0)}%</span>
    </div>
  `).join('');
}

function renderIncomeDonut() {
  let cv = document.getElementById('income-donut');
  if (!cv) return;
  let ctx = cv.getContext('2d'); let s = 200; let r = 75; let w = 32;
  cv.width = s; cv.height = s;
  ctx.clearRect(0,0,s,s);
  let groups = {};
  state.incomes.forEach(inc => { let k = inc.name || 'Income'; groups[k] = (groups[k] || 0) + inc.amount; });
  let entries = Object.entries(groups).filter(([k,v]) => v > 0);
  if (entries.length === 0) {
    ctx.fillStyle = 'var(--ts)'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t('no_data'), s/2, s/2);
    return;
  }
  let total = entries.reduce((s, [k,v]) => s + v, 0);
  let start = -Math.PI / 2;
  entries.forEach(([name, amt], i) => {
    let slice = (amt / total) * Math.PI * 2;
    let gap = 0.04;
    ctx.beginPath(); ctx.arc(s/2, s/2, r, start + gap, start + slice - gap);
    ctx.arc(s/2, s/2, r - w, start + slice - gap, start + gap, true);
    ctx.closePath();
    ctx.fillStyle = INCOME_COLORS[i % INCOME_COLORS.length];
    ctx.fill();
    start += slice;
  });
  ctx.fillStyle = 'var(--tx)'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(cs() + total.toFixed(0), s/2, s/2 - 6);
  ctx.fillStyle = 'var(--ts)'; ctx.font = '10px sans-serif';
  ctx.fillText(t('income'), s/2, s/2 + 12);
  let leg = document.getElementById('income-donut-legend');
  leg.innerHTML = entries.sort((a,b) => b[1] - a[1]).map(([name, amt], i) => `
    <div style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px">
      <span style="width:12px;height:12px;border-radius:3px;background:${INCOME_COLORS[i % INCOME_COLORS.length]};flex-shrink:0"></span>
      <span style="flex:1">${tin(name)}</span>
      <span style="font-weight:600">${cs()}${amt.toFixed(0)}</span>
      <span style="color:var(--ts);min-width:36px;text-align:right">${(amt/total*100).toFixed(0)}%</span>
    </div>
  `).join('');
}

function renderIncomeBreakdown() {
  let el = document.getElementById('income-breakdown');
  if (!el) return;
  // Group incomes by name
  let groups = {};
  state.incomes.forEach(inc => {
    let k = inc.name || 'Income';
    groups[k] = (groups[k] || 0) + inc.amount;
  });
  let entries = Object.entries(groups);
  if (entries.length === 0) {
    el.innerHTML = '<div style="font-size:12px;color:var(--ts);text-align:center;padding:8px">' + t('no_entries') + '</div>';
    return;
  }
  let total = entries.reduce((s, [k,v]) => s + v, 0);
  let colors = ['#00BFA6','#4ECDC4','#FFE66D','#FF6B6B','#A29BFE','#FFD93D','#0984E3','#636E72'];
  el.innerHTML = entries.map(([name, amt], i) => {
    let pct = (amt / total * 100);
    return `
      <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(128,128,128,.08)">
        <span style="width:10px;height:10px;border-radius:50%;background:${colors[i%colors.length]};flex-shrink:0"></span>
        <span style="flex:1;font-size:13px">${tin(name)}</span>
        <span style="font-weight:600;font-size:13px">${cs()}${amt.toFixed(0)}</span>
        <span style="color:var(--ts);font-size:11px">${pct.toFixed(0)}%</span>
      </div>`;
  }).join('');
}

function renderIncExpCompare() {
  let el = document.getElementById('inc-exp-compare');
  if (!el) return;
  let inc = state.total_income || 0;
  let exp = state.total_expenses || 0;
  let maxVal = Math.max(inc, exp, 1);
  let incPct = (inc / maxVal) * 100;
  let expPct = (exp / maxVal) * 100;
  el.innerHTML = `
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
        <span style="color:var(--inc);font-weight:600">${t('income')}</span>
        <span style="font-weight:600">${cs()}${inc.toLocaleString()}</span>
      </div>
      <div style="height:18px;background:rgba(128,128,128,.1);border-radius:9px;overflow:hidden">
        <div style="height:100%;width:${incPct}%;background:var(--inc);border-radius:9px;transition:width .4s"></div>
      </div>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
        <span style="color:var(--exp);font-weight:600">${t('expenses')}</span>
        <span style="font-weight:600">${cs()}${exp.toLocaleString()}</span>
      </div>
      <div style="height:18px;background:rgba(128,128,128,.1);border-radius:9px;overflow:hidden">
        <div style="height:100%;width:${expPct}%;background:var(--exp);border-radius:9px;transition:width .4s"></div>
      </div>
    </div>
    <div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(128,128,128,.1);display:flex;justify-content:space-between;font-size:13px">
      <span style="color:var(--pri);font-weight:600">${t('net')}</span>
      <span style="font-weight:600;color:${state.net >= 0 ? 'var(--inc)' : 'var(--exp)'}">${state.net >= 0 ? '+' : '-'}${cs()}${Math.abs(state.net).toLocaleString()}</span>
    </div>
  `;
}

// ── Init ──
document.addEventListener('DOMContentLoaded', async () => {
  await refresh();
  setDate('today');
  switchAddTab('inc');
  document.getElementById('date-picker').value = state.today;
  // Falls back only if the server sent nothing at all. The default itself
  // lives in app.py — writing it in both places is how two defaults drift
  // apart, and this one would have quietly overridden the other.
  state.lang = state.lang || 'ar';
  applyI18n();
  document.getElementById('title').textContent = t('title');
});
</script>
