name: Web Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    working-directory: web

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package web assets
        run: |
          mkdir -p ../dist/web
          cp -r index.html script.js statement.js tour.js i18n.js package.json icon.png \
            public/ __tests__/ scripts/ evidence/ \
            ../dist/web/ 2>/dev/null || true

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: dist/web/
          if-no-files-found: error

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # A repository without a Pages site makes configure-pages fail with
      # "Get Pages site failed", turning every push to main red even though the
      # build itself is fine. Ask GitHub first, and skip the deploy when there
      # is nowhere to deploy to.
      - name: Check whether GitHub Pages is configured
        id: pages
        # The deploy job has no checkout, so the workflow default
        # working-directory (web) does not exist here and bash refuses to
        # start — which is how every push to main went red before Pages
        # existed, and how the site stayed unpublished after it did.
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages deploy skipped::GitHub Pages is not configured for $REPO. Enable it under Settings > Pages (Source: GitHub Actions) to publish this build."
          fi

      - uses: actions/download-artifact@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          name: web-bundle
          path: ./_site

      - uses: actions/configure-pages@v4
        if: steps.pages.outputs.enabled == 'true'

      - name: Upload pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
